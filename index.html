<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Scramjet Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ツールバーは非表示 */
        .toolbar {
            display: none !important;
        }

        /* iframeを画面いっぱいに */
        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #1a1a1a;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div class="toolbar" style="display:none;">
        <input type="text" id="urlInput">
    </div>
    
    <iframe id="browserFrame" title="Scramjet Browser"></iframe>

    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>

    <script>
        const { Controller } = $scramjetController;
        const { defaultConfig } = $scramjet;
        const EpoxyTransport = self.EpoxyTransport.default;

        const iframe = document.getElementById("browserFrame");

        function norm(u) {
            return u.startsWith("http") ? u : "https://" + u;
        }

        async function init() {
            try {
                // 1. URLのパラメータ (?url=...) をチェック
                const urlParams = new URLSearchParams(window.location.search);
                const targetUrlParam = urlParams.get('url');
                
                // 2. ?url= がない場合はここで処理をストップ（何もしない）
                if (!targetUrlParam) {
                    return;
                }

                const serviceworker =
                    navigator.serviceWorker.controller ??
                    (await navigator.serviceWorker.ready).active;

                const transport = new EpoxyTransport({
                    wisp: "wss://wisp.mercurywork.shop/"
                });

                await transport.init();

                const scramjet = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });

                await scramjet.wait();

                const initialUrl = norm(targetUrlParam);

                // 指定されたURLをiframeで開く
                const frame = scramjet.createFrame(iframe);
                frame.go(initialUrl);

            } catch (e) {
                console.error(e);
            }
        }

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(init);
        }
    </script>
</body>

</html>
